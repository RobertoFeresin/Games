<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <title>Jogo de Skate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="container-jogo">
            <img src="/Imagens/Mapa/Pixelminedia.gif" id="Imagem_fundo" alt="Imagem de fundo">

            <div id="chao">
